name: Check links

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths: ['**/*.md']

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path node_modules
            --exclude '^https://sticko-app\.github\.io/'
            --exclude '^https://raw\.githubusercontent\.com/sticko-app/'
            --exclude 'example\.com'
            --exclude 'id=com\.example'
            './**/*.md'
          fail: true
